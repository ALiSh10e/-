<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Soft Inner Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base App Icon -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#34d399" stroke-width="6" filter="url(#dropShadow)" />

  <!-- Subtle Inner Ring Highlight -->
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Background Decorative Starburst Particles -->
  <circle cx="90" cy="110" r="8" fill="#fde047" opacity="0.8" />
  <circle cx="420" cy="120" r="12" fill="#fde047" opacity="0.8" />
  <circle cx="80" cy="400" r="6" fill="#38bdf8" opacity="0.7" />
  <circle cx="430" cy="380" r="10" fill="#a7f3d0" opacity="0.6" />

  <!-- Open Book Symbol Base -->
  <g transform="translate(0, 10)">
    <!-- Book Backing Shadow -->
    <path d="M 110 320 Q 256 360 402 320 L 416 348 Q 256 390 96 348 Z" fill="#064e3b" opacity="0.6" />

    <!-- Open Book Left Page -->
    <path d="M 256 320 C 210 300 150 295 104 312 L 104 190 C 150 174 210 178 256 200 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" />
    <!-- Left Page Texture Lines -->
    <line x1="130" y1="215" x2="230" y2="225" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <line x1="130" y1="240" x2="230" y2="250" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <line x1="130" y1="265" x2="210" y2="275" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />

    <!-- Open Book Right Page -->
    <path d="M 256 200 C 302 178 362 174 408 190 L 408 312 C 362 295 302 300 256 320 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3" />
    <!-- Right Page Texture Lines -->
    <line x1="282" y1="225" x2="382" y2="215" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <line x1="282" y1="250" x2="382" y2="240" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <line x1="302" y1="275" x2="382" y2="265" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />

    <!-- Book Center Spine Ridge -->
    <line x1="256" y1="195" x2="256" y2="330" stroke="#0d9488" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Central Crest: Arabic Calligraphy "صَحّ" with Verified Checkmark -->
  <g transform="translate(256, 175)" filter="url(#dropShadow)">
    <!-- Golden Sunburst Badge -->
    <circle cx="0" cy="0" r="68" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="6" />

    <!-- Checkmark & Diacritics -->
    <!-- Distinctive White "صَحّ" Arabic Lettering -->
    <text x="0" y="24" font-family="'Cairo', 'Tajawal', sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle">
      صَحّ
    </text>
  </g>

  <!-- Top App Name Banner Text in Arabic -->
  <text x="256" y="96" font-family="'Cairo', 'Tajawal', sans-serif" font-size="34" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="1">
    أَقْرَأُهَا صَحّ
  </text>

  <!-- Lower Ribbon / Subtitle: تعليم القراءة والكتابة -->
  <g transform="translate(256, 420)">
    <rect x="-140" y="-20" width="280" height="40" rx="20" fill="#047857" stroke="#6ee7b7" stroke-width="2.5" />
    <text x="0" y="7" font-family="'Cairo', 'Tajawal', sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">
      تعلّم العربية • الصفوف 1 - 6
    </text>
  </g>

  <!-- Top Shining Star Indicator -->
  <polygon points="256,18 262,34 278,34 265,44 270,60 256,50 242,60 247,44 234,34 250,34" fill="#fde047" stroke="#d97706" stroke-width="1.5" />
</svg>
