name: بناء وتصدير تطبيق أَقْرَأُهَا صَحّ (Build Aqraha Sah Android APK)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # يتيح تشغيل البناء يدوياً بنقرة زر من تبويب Actions في GitHub

jobs:
  build:
    name: بناء وتصدير ملف APK لتطبيق أقرأها صح (Build APK)
    runs-on: ubuntu-latest

    steps:
      - name: استدعاء كود المستودع (Checkout Repository)
        uses: actions/checkout@v4

      - name: تثبيت وضبط بيئة جافا 17 (Set up JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: إعداد وضبط حزم Android SDK
        uses: android-actions/setup-android@v3

      - name: إعطاء صلاحيات التشغيل لملف Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          elif [ -f "./android-app/gradlew" ]; then
            chmod +x ./android-app/gradlew
          fi

      - name: التحقق من بنية المشروع ومجلد أندرويد
        run: |
          if [ -d "./android-app" ]; then
            echo "ANDROID_DIR=./android-app" >> $GITHUB_ENV
          else
            echo "ANDROID_DIR=." >> $GITHUB_ENV
          fi

      - name: بناء ملف APK تجريبي (Assemble Debug APK)
        run: |
          cd ${{ env.ANDROID_DIR }}
          # إنشاء gradlew wrapper إذا لزم الأمر
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
            chmod +x ./gradlew
          fi
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: رفع وتصدير ملف APK كملف قابل للتنزيل (Upload APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: lughati-yemen-debug-apk
          path: |
            ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: إنشاء إصدار تلقائي في GitHub Releases عند إضافة Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          name: إصدار تطبيق لغتي اليمنية ${{ github.ref_name }}
          body: |
            ## تطبيق «لغتي اليمنية – تعلّم العربية» للمرحلة الابتدائية
            - ملف APK جاهز للتثبيت الفوري على أجهزة أندرويد 7.0 (API 24) فما فوق.
            - نسخة كاملة ومستقلة تحتوي على جميع الدروس والحروف والأنشطة.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
